services:
  # ── Message broker ──────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Vector database ─────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    expose:
      - "8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Local LLM (embeddings + generation) ─────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/11434'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-time model-pull job (runs after ollama is healthy, then exits)
  ollama-setup:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull nomic-embed-text
        ollama pull llama3.2
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  # ── Defect ingestor worker ───────────────────────────────────────────────────
  ingestor:
    build:
      context: ./ingestor
    depends_on:
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      OLLAMA_HOST: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      QUEUE_NAME: ${QUEUE_NAME:-defects}
      PREFETCH_COUNT: ${PREFETCH_COUNT:-1}
      METRICS_LOG_INTERVAL_SECONDS: ${METRICS_LOG_INTERVAL_SECONDS:-30}
      DLX_EXCHANGE: ${DLX_EXCHANGE:-defects.dlx}
      DLQ_NAME: ${DLQ_NAME:-defects.dlq}
    restart: unless-stopped

  # ── REST API ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      OLLAMA_HOST: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      QUEUE_NAME: ${QUEUE_NAME:-defects}
      DLX_EXCHANGE: ${DLX_EXCHANGE:-defects.dlx}
      DLQ_NAME: ${DLQ_NAME:-defects.dlq}
      USE_LANGGRAPH_QUERY: ${USE_LANGGRAPH_QUERY:-false}
      USE_LANGGRAPH_SUMMARY: ${USE_LANGGRAPH_SUMMARY:-false}
    restart: unless-stopped

  # ── Web UI ────────────────────────────────────────────────────────────────────
  ui:
    build:
      context: ./ui
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  rabbitmq_data:
  chroma_data:
  ollama_data:
